name: oyuntan
description: Карьерын гарааны платформ — оюутан ба компанийн холбоос
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.0.4
  firebase_storage: ^12.1.3

  # ── State management ──────────────────────────────
  provider: ^6.1.2
  go_router: ^14.2.0

  # ── UI ────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # ── Utilities ─────────────────────────────────────
  http: ^1.2.1
  intl: ^0.19.0
  shared_preferences: ^2.3.1
  image_picker: ^1.1.2
  pdf: ^3.11.0
  printing: ^5.13.1
  url_launcher: ^6.3.0
  uuid: ^4.4.2
  timeago: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
